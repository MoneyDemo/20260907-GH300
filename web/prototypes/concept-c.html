<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>CyberPulse 2099</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
<style>
  :root{ --neon-cyan:#00f0ff; --neon-magenta:#f700ff; --neon-amber:#ffb800; --neon-red:#ff003c; --state:#00f0ff; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:#0a0b10; color:#e8faff;
    font-family:'Share Tech Mono','Noto Sans TC',monospace; overflow-x:hidden; position:relative;}
  #particles{ position:fixed; inset:0; z-index:0;}
  .scanlines{ position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.06;
    background:repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px);}
  .wrap{ position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:28px 18px;}
  header{ text-align:center; margin-bottom:20px;}
  header h1{ font-family:'Orbitron',sans-serif; letter-spacing:.2em; font-size:2rem; margin:0;
    color:var(--state); text-shadow:0 0 16px var(--state), 0 0 32px var(--state);}
  header p{ color:#8fb0c2; letter-spacing:.08em;}
  .grid{ display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:20px;}
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }
  .panel{ background:linear-gradient(160deg, rgba(20,10,30,.7), rgba(10,5,20,.85));
    border:1px solid var(--state); border-radius:6px; padding:20px; position:relative;
    box-shadow:0 0 20px color-mix(in srgb, var(--state) 50%, transparent);
    clip-path:polygon(0 8px,8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);}
  label{ display:block; font-size:.75rem; letter-spacing:.1em; color:#8fb0c2; margin:14px 0 6px;}
  input{ width:100%; padding:12px 14px; border-radius:4px; border:1px solid var(--state); background:#050608;
    color:#e8faff; font-size:1rem; outline:none; transition:.2s;}
  input:focus{ box-shadow:0 0 14px var(--state);}
  button{ margin-top:18px; width:100%; padding:14px; border-radius:4px; border:1px solid var(--state);
    background:linear-gradient(135deg, color-mix(in srgb, var(--state) 30%, transparent), transparent);
    color:#e8faff; font-size:1rem; letter-spacing:.15em; cursor:pointer;}
  button:hover{ box-shadow:0 0 24px var(--state);}
  #shakeTarget{ transition:none;}
  .result-title{ text-align:center; color:#8fb0c2; letter-spacing:.2em; font-size:.75rem; margin:0;}
  .bmi-num{ text-align:center; font-family:'Orbitron',sans-serif; font-size:3.2rem; font-weight:700; margin:6px 0;
    color:#fff; text-shadow:0 0 18px var(--state); font-variant-numeric:tabular-nums;}
  .badge{ display:block; width:fit-content; margin:0 auto 12px; padding:6px 18px; border-radius:2px;
    letter-spacing:.15em; font-weight:700; border:1px solid var(--state); color:#fff;
    background:color-mix(in srgb, var(--state) 25%, transparent);}
  .avatar{ width:100%; height:140px; display:flex; align-items:center; justify-content:center;}
  .avatar svg{ filter:drop-shadow(0 0 8px var(--state));}
  .ring-wrap{ position:relative; width:220px; margin:8px auto;}
  canvas#historyChart{ max-height:220px;}
  .section-title{ text-align:center; letter-spacing:.2em; color:#8fb0c2; font-size:.8rem; margin-top:0;}
  #levelup{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.6); opacity:0; pointer-events:none;}
  #levelup span{ font-family:'Orbitron',sans-serif; font-size:4rem; color:#fff;
    text-shadow:0 0 20px var(--neon-cyan),0 0 40px var(--neon-magenta);}
</style>
</head>
<body>
<div id="particles"></div>
<div class="scanlines"></div>
<div id="levelup"><span>LEVEL UP!</span></div>
<div class="wrap" id="shakeTarget">
  <header>
    <h1>CYBERPULSE 2099</h1>
    <p>人體生化機能量子躍遷站</p>
  </header>
  <div class="grid">
    <div class="panel">
      <p class="section-title">輸入舷艙</p>
      <label>體重（磅）</label>
      <input type="number" id="weight" value="154">
      <label>身高（公尺）</label>
      <input type="number" step="0.01" id="height" value="1.70">
      <button id="diagBtn">▶ 啟動診斷</button>
    </div>
    <div class="panel">
      <p class="result-title">反應爐讀值</p>
      <div class="bmi-num" id="bmiNum">--.--</div>
      <div class="badge" id="badge">待機</div>
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" width="100%">
          <circle cx="110" cy="110" r="90" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>
          <circle id="ring" cx="110" cy="110" r="90" fill="none" stroke="var(--neon-cyan)" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="565.5"
            transform="rotate(-90 110 110)"/>
        </svg>
      </div>
    </div>
    <div class="panel">
      <p class="section-title">生化線框</p>
      <div class="avatar">
        <svg width="70" height="130" viewBox="0 0 70 130">
          <circle id="av-head" cx="35" cy="16" r="12" fill="none" stroke="var(--neon-cyan)" stroke-width="2"/>
          <line id="av-spine" x1="35" y1="28" x2="35" y2="80" stroke="var(--neon-cyan)" stroke-width="2"/>
          <line id="av-arms" x1="10" y1="45" x2="60" y2="45" stroke="var(--neon-cyan)" stroke-width="2"/>
          <line id="av-legl" x1="35" y1="80" x2="15" y2="125" stroke="var(--neon-cyan)" stroke-width="2"/>
          <line id="av-legr" x1="35" y1="80" x2="55" y2="125" stroke="var(--neon-cyan)" stroke-width="2"/>
        </svg>
      </div>
    </div>
    <div class="panel" style="grid-column:1 / -1;">
      <p class="section-title">霓虹心電圖 ─ 生化時空日誌</p>
      <canvas id="historyChart"></canvas>
    </div>
  </div>
</div>

<script>
tsParticles.load("particles", {
  fullScreen:{enable:false}, background:{color:'transparent'},
  particles:{
    number:{ value: 90 },
    color:{ value: ['#00f0ff','#f700ff','#ffb800'] },
    links:{ enable:true, color:'#7b2cff', distance:110, opacity:.3 },
    move:{ enable:true, speed:.7 },
    size:{ value: 2 }, opacity:{ value:.6 }
  },
  interactivity:{ events:{ onHover:{ enable:true, mode:'repulse' } }, modes:{ repulse:{ distance:100 } } }
});

const THRESH = {under:18.5, normal:24, over:27};
const NEON = {under:'#4fc3f7', normal:'#00e676', over:'#ffb300', obese:'#ff003c'};
const LABELS = {under:'能量偏低', normal:'正常能量', over:'超載警報', obese:'危險過載'};

function calculateBmi(weightLb, heightM){ return (weightLb*0.453592) / (heightM**2); }
function classifyBmi(bmi){
  if (bmi < THRESH.under) return 'under';
  if (bmi < THRESH.normal) return 'normal';
  if (bmi < THRESH.over) return 'over';
  return 'obese';
}

const HISTORY_KEY = 'bmiHistory_conceptC';
const FIRST_NORMAL_KEY = 'bmiFirstNormal_conceptC';
function loadHistory(){ try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e){ return []; } }
function saveHistory(list){ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }

let chart;
function renderChart(){
  const history = loadHistory();
  const ctx = document.getElementById('historyChart');
  const data = {
    labels: history.map((h,i)=>`#${i+1}`),
    datasets:[{
      label:'BMI', data:history.map(h=>h.bmi),
      borderColor:'#00f0ff', backgroundColor:'rgba(0,240,255,.1)', fill:true, tension:.25,
      pointBackgroundColor:'#f700ff', pointRadius:5, borderWidth:2
    }]
  };
  const opts = { animation:{duration:800}, plugins:{legend:{display:false}},
    scales:{ x:{ ticks:{color:'#8fb0c2'}, grid:{color:'rgba(255,255,255,.06)'} },
             y:{ suggestedMin:10, suggestedMax:35, ticks:{color:'#8fb0c2'}, grid:{color:'rgba(255,255,255,.06)'} } } };
  if (chart) { chart.data = data; chart.update(); }
  else chart = new Chart(ctx, { type:'line', data, options: opts });
}
renderChart();

const RING_LEN = 565.5;
function setRing(bmi){
  const pct = Math.min(1, Math.max(0, (bmi-10)/(40-10)));
  gsap.to('#ring', { attr:{'stroke-dashoffset': RING_LEN * (1-pct)}, duration:1.2, ease:'power3.out' });
}

function countUp(el, target){
  const obj = { v:0 };
  gsap.to(obj, { v: target, duration:1.0, ease:'power2.out', onUpdate:()=> el.textContent = obj.v.toFixed(2) });
}

function reshapeAvatar(category){
  const bend = { under:-6, normal:0, over:6, obese:14 }[category];
  gsap.to('#av-spine', { attr:{ x2: 35+bend }, duration:.6, ease:'power2.out' });
  gsap.to('#av-legl, #av-legr, #av-arms, #av-head, #av-spine', {
    attr:{ stroke: NEON[category] }, duration:.4
  });
}

function screenShake(){
  gsap.fromTo('#shakeTarget', { x:0 }, { x:6, duration:.04, yoyo:true, repeat:7, clearProps:'x' });
}

function levelUpFlash(){
  const el = document.getElementById('levelup');
  gsap.timeline()
    .set(el, { pointerEvents:'auto' })
    .to(el, { opacity:1, duration:.15 })
    .to(el, { opacity:0, duration:.6, delay:.9 })
    .set(el, { pointerEvents:'none' });
  confetti({ particleCount:160, spread:100, origin:{y:.5}, colors:['#00f0ff','#f700ff','#ffb800'] });
}

document.getElementById('diagBtn').addEventListener('click', () => {
  const weight = parseFloat(document.getElementById('weight').value);
  const height = parseFloat(document.getElementById('height').value);
  if (!weight || !height) return;

  screenShake();

  const bmi = calculateBmi(weight, height);
  const category = classifyBmi(bmi);
  const color = NEON[category];

  document.documentElement.style.setProperty('--state', color);
  document.getElementById('badge').textContent = LABELS[category];
  countUp(document.getElementById('bmiNum'), bmi);
  setRing(bmi);
  reshapeAvatar(category);

  const history = loadHistory();
  history.push({ t: Date.now(), weight, height, bmi:Number(bmi.toFixed(2)), category });
  saveHistory(history);
  renderChart();

  if (category === 'normal' && !localStorage.getItem(FIRST_NORMAL_KEY)) {
    localStorage.setItem(FIRST_NORMAL_KEY, '1');
    setTimeout(levelUpFlash, 300);
  }
});
</script>
</body>
</html>
