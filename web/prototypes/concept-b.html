<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>AURA CORE｜生命體徵核心艙</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
<style>
  :root{
    --hue-under:200; --hue-normal:150; --hue-over:40; --hue-obese:340;
    --state-hue: 190; /* 待機預設青色，結果出來後由 JS 感染式改變 */
    --bg-deep:#05060e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; font-family:"Chakra Petch","Noto Sans TC",sans-serif; color:#eaf6ff;
    background: radial-gradient(circle at 20% 20%, hsla(var(--state-hue),90%,55%,.18), transparent 45%),
                radial-gradient(circle at 80% 70%, hsla(calc(var(--state-hue) + 140),80%,55%,.15), transparent 45%),
                var(--bg-deep);
    transition: background 1.2s ease; overflow-x:hidden; position:relative;
  }
  #particles{ position:fixed; inset:0; z-index:0;}
  .wrap{ position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:32px 20px;}
  header{ text-align:center; margin-bottom:24px;}
  header h1{ font-family:'Orbitron',sans-serif; letter-spacing:.15em; font-size:1.8rem; margin:0;
    color:#eafcff; text-shadow:0 0 12px hsla(var(--state-hue),100%,60%,.8);}
  header p{ color:#9db3c9; letter-spacing:.08em;}
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  @media (max-width:800px){ .grid{grid-template-columns:1fr;} }
  .glass{ background:rgba(255,255,255,.04); border-radius:20px; padding:24px;
    border:1px solid hsla(var(--state-hue),80%,60%,.35);
    backdrop-filter:blur(20px) saturate(180%);
    box-shadow: inset 0 0 30px hsla(var(--state-hue),80%,60%,.08), 0 0 24px hsla(var(--state-hue),80%,50%,.15);
    transition: border-color 1s, box-shadow 1s;
  }
  label{ display:block; font-size:.8rem; letter-spacing:.1em; color:#9db3c9; margin:14px 0 6px;}
  input{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid hsla(var(--state-hue),70%,60%,.4);
    background:rgba(255,255,255,.03); color:#eaf6ff; font-size:1rem; outline:none; transition:.25s;
    font-family:'Rajdhani',sans-serif;}
  input:focus{ border-color:hsl(var(--state-hue) 90% 65%); box-shadow:0 0 16px hsla(var(--state-hue),90%,60%,.5);}
  button{ margin-top:20px; width:100%; padding:14px; border-radius:12px; border:1px solid hsl(var(--state-hue) 90% 60%);
    background:linear-gradient(135deg, hsla(var(--state-hue),90%,55%,.25), hsla(calc(var(--state-hue)+140),90%,55%,.25));
    color:#eaf6ff; font-size:1rem; letter-spacing:.1em; cursor:pointer; position:relative; overflow:hidden;}
  button:hover{ box-shadow:0 0 24px hsla(var(--state-hue),90%,60%,.6);}
  .result-title{ text-align:center; color:#9db3c9; letter-spacing:.15em; font-size:.8rem; margin:0;}
  .bmi-num{ text-align:center; font-family:'Orbitron',sans-serif; font-size:3.4rem; font-weight:700; margin:6px 0;
    color:#fff; text-shadow:0 0 20px hsl(var(--state-hue) 90% 60%); font-variant-numeric:tabular-nums;}
  .badge{ display:block; width:fit-content; margin:0 auto 16px; padding:6px 18px; border-radius:999px;
    letter-spacing:.1em; font-weight:700; border:1px solid hsl(var(--state-hue) 90% 65%); color:#fff;
    background:hsla(var(--state-hue),80%,45%,.35);}
  .ring-wrap{ position:relative; width:260px; margin:0 auto;}
  canvas#historyChart{ max-height:220px;}
  .section-title{ text-align:center; letter-spacing:.15em; color:#9db3c9; font-size:.85rem; margin-top:0;}
</style>
</head>
<body>
<div id="particles"></div>
<div class="wrap">
  <header>
    <h1>◇ AURA CORE</h1>
    <p>生命體徵核心艙　— 你的 BMI 不是數字，是會共鳴的能量核心</p>
  </header>
  <div class="grid">
    <div class="glass">
      <label>體重（磅）</label>
      <input type="number" id="weight" value="154">
      <label>身高（公尺）</label>
      <input type="number" step="0.01" id="height" value="1.70">
      <button id="scanBtn">啟動掃描</button>
    </div>
    <div class="glass">
      <p class="result-title">核心讀值</p>
      <div class="bmi-num" id="bmiNum">--.--</div>
      <div class="badge" id="badge">待機中</div>
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" width="100%">
          <circle cx="110" cy="110" r="90" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="16"/>
          <circle id="ring" cx="110" cy="110" r="90" fill="none" stroke="url(#grad)" stroke-width="16"
            stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="565.5"
            transform="rotate(-90 110 110)"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00f0ff"/>
              <stop offset="100%" stop-color="#ff2d95"/>
            </linearGradient>
          </defs>
          <text x="110" y="118" text-anchor="middle" font-size="14" fill="#9db3c9">BMI</text>
        </svg>
      </div>
    </div>
    <div class="glass" style="grid-column:1 / -1;">
      <p class="section-title">時間軸掃描紀錄 CHRONOSCAN LOG</p>
      <canvas id="historyChart"></canvas>
    </div>
  </div>
</div>

<script>
tsParticles.load("particles", {
  fullScreen:{enable:false}, background:{color:'transparent'},
  particles:{
    number:{ value: 60 },
    color:{ value: ['#00f0ff','#7b5cff','#ff2d95'] },
    links:{ enable:true, color:'#7b5cff', distance:130, opacity:.25 },
    move:{ enable:true, speed:.4 },
    size:{ value: 2 }, opacity:{ value:.5 }
  },
  interactivity:{ events:{ onHover:{ enable:true, mode:'repulse' } }, modes:{ repulse:{ distance:80 } } }
});

const THRESH = {under:18.5, normal:24, over:27};
const HUE = {under:200, normal:150, over:40, obese:340};
const LABELS = {under:'過輕・低能量', normal:'正常・穩定核心', over:'過重・能量超載', obese:'肥胖・警戒過載'};

function calculateBmi(weightLb, heightM){ return (weightLb*0.453592) / (heightM**2); }
function classifyBmi(bmi){
  if (bmi < THRESH.under) return 'under';
  if (bmi < THRESH.normal) return 'normal';
  if (bmi < THRESH.over) return 'over';
  return 'obese';
}

const HISTORY_KEY = 'bmiHistory_conceptB';
function loadHistory(){ try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e){ return []; } }
function saveHistory(list){ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }

let chart;
function renderChart(){
  const history = loadHistory();
  const ctx = document.getElementById('historyChart');
  const data = {
    labels: history.map((h,i)=>`#${i+1}`),
    datasets:[{
      label:'BMI', data:history.map(h=>h.bmi),
      borderColor:'#00f0ff', backgroundColor:'rgba(0,240,255,.12)', fill:true, tension:.3,
      pointBackgroundColor:'#ff2d95', pointRadius:5, borderWidth:2
    }]
  };
  const opts = { animation:{duration:900}, plugins:{legend:{display:false}},
    scales:{ x:{ ticks:{color:'#9db3c9'}, grid:{color:'rgba(255,255,255,.06)'} },
             y:{ suggestedMin:10, suggestedMax:35, ticks:{color:'#9db3c9'}, grid:{color:'rgba(255,255,255,.06)'} } } };
  if (chart) { chart.data = data; chart.update(); }
  else chart = new Chart(ctx, { type:'line', data, options: opts });
}
renderChart();

const RING_LEN = 565.5;
function setRing(bmi){
  const pct = Math.min(1, Math.max(0, (bmi-10)/(40-10)));
  gsap.to('#ring', { attr:{'stroke-dashoffset': RING_LEN * (1-pct)}, duration:1.3, ease:'power3.out' });
}

function countUp(el, target){
  const obj = { v:0 };
  gsap.to(obj, { v: target, duration:1.1, ease:'power2.out', onUpdate:()=> el.textContent = obj.v.toFixed(2) });
}

document.getElementById('scanBtn').addEventListener('click', () => {
  const weight = parseFloat(document.getElementById('weight').value);
  const height = parseFloat(document.getElementById('height').value);
  if (!weight || !height) return;

  gsap.fromTo('.glass', {boxShadow:'0 0 0px transparent'}, {boxShadow:'0 0 40px hsla(var(--state-hue),90%,60%,.4)', duration:.3, yoyo:true, repeat:1});

  const bmi = calculateBmi(weight, height);
  const category = classifyBmi(bmi);
  const hue = HUE[category];

  document.documentElement.style.setProperty('--state-hue', hue);
  gsap.to(document.body, { duration: 1.2 }); // 觸發 CSS transition 感染式變色

  document.getElementById('badge').textContent = LABELS[category];
  countUp(document.getElementById('bmiNum'), bmi);
  setRing(bmi);

  const history = loadHistory();
  history.push({ t: Date.now(), weight, height, bmi:Number(bmi.toFixed(2)), category });
  saveHistory(history);
  renderChart();
});
</script>
</body>
</html>
